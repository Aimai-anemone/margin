<!doctype html>
<html lang="ja">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Margin 64px情景一覧（開発専用）</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f5f6f7; color: #121a23; font: 14px/1.6 system-ui, sans-serif; }
  header { padding: 20px; max-width: 700px; margin: auto; }
  h1 { font-size: 18px; margin: 0; }
  p { margin: 6px 0 0; color: #626a73; }
  main { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 390px), 1fr)); }
  figure { width: 100%; max-width: 430px; padding: 0 20px; margin: 0 auto 20px; min-width: 0; }
  img { display: block; width: 100%; height: 64px; border-radius: 3px; object-fit: cover; object-position: center; background: #eef1f3; }
  figcaption { margin-top: 4px; font-size: 12px; overflow-wrap: anywhere; }
</style>
<header><h1>64px情景一覧 · 30枚</h1><p>Todayと同じ高さ・最大幅・左右余白。開発サーバー専用で、本番ビルドには含みません。</p></header>
<main id="strips"></main>
<script type="module">
  const files = Object.keys(import.meta.glob('/public/scenery/*.webp')).sort()
  const list = document.querySelector('#strips')
  for (const path of files) {
    const figure = document.createElement('figure')
    const img = document.createElement('img')
    img.src = `${import.meta.env.BASE_URL}${path.slice('/public/'.length)}`
    img.alt = ''
    img.width = 1074
    img.height = 192
    const caption = document.createElement('figcaption')
    caption.textContent = path.split('/').at(-1)
    figure.append(img, caption)
    list.append(figure)
  }
</script>
</html>
